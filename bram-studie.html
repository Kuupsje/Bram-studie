let checked = {}, currentMonth = 1, activePlanMonth = 1, saving = false;

function isChecked(id,i){return !!(checked[id]&&checked[id][i]);}

async function toggle(id,i){
  if(!checked[id])checked[id]={};
  checked[id][i]=!checked[id][i];
  renderAll();
  if(saving)return;
  saving=true; setStatus('Opslaan...');
  try{
    await setDoc(docRef,{checked,currentMonth,updatedAt:new Date().toISOString()});
    setStatus('Gesynchroniseerd ✓');
    document.getElementById('sync-dot').className='sync-dot';
  }catch(e){setStatus('Fout bij opslaan');document.getElementById('sync-dot').className='sync-dot off';}
  saving=false;
}

async function saveMonth(m){
  currentMonth=m;activePlanMonth=m;
  try{await setDoc(docRef,{checked,currentMonth,updatedAt:new Date().toISOString()});setStatus('Gesynchroniseerd ✓');}catch(e){setStatus('Fout bij opslaan');}
  renderAll();
}

function setStatus(msg){
  document.getElementById('status-bar').textContent=msg;
  document.getElementById('topbar-sub').textContent=msg;
}

onSnapshot(docRef,snap=>{
  if(snap.exists()){
    const d=snap.data();
    checked=d.checked||{};currentMonth=d.currentMonth||1;activePlanMonth=currentMonth;
    document.getElementById('sync-dot').className='sync-dot';
    const ts=d.updatedAt?new Date(d.updatedAt).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}):'';
    setStatus('Live gesynchroniseerd'+(ts?' · '+ts:''));
  }else{setStatus('Nieuw — nog geen data');}
  renderAll();
},()=>{setStatus('Geen verbinding');document.getElementById('sync-dot').className='sync-dot off';});

function totalStats(){
  let total=0,done=0;
  VAKKEN.forEach(v=>v.items.forEach((_,i)=>{total++;if(isChecked(v.id,i))done++;}));
  return{total,done,pct:total?Math.round(done/total*100):0};
}
function vakStats(v){
  let done=0;v.items.forEach((_,i)=>{if(isChecked(v.id,i))done++;});
  return{total:v.items.length,done,pct:v.items.length?Math.round(done/v.items.length*100):0};
}
function inMonth(item,m){const f=(m-1)*4+1,t=m*4;return!(item.wt<f||item.wv>t);}
function tagEl(type){const l={nieuw:'nieuw',uitbr:'uitbreiden',basis:'herhalen'};return `<span class="tag tag-${type}">${l[type]}</span>`;}
function bronLink(url,label){return `<a href="${url}" target="_blank" class="bron-link">${label} &#8599;</a>`;}

function renderAll(){
  const s=totalStats();
  document.getElementById('stat-pct').textContent=s.pct+'%';
  document.getElementById('prog-totaal').style.width=s.pct+'%';
  document.getElementById('stat-done').textContent=s.done;
  document.getElementById('stat-done-sub').textContent='van '+s.total;
  document.getElementById('stat-maand').textContent=currentMonth;
  const st=document.getElementById('streak-text'),ss=document.getElementById('streak-sub');
  if(s.done===0){st.textContent='Begin vandaag!';ss.textContent='Vink je eerste onderwerp af';}
  else if(s.done<5){st.textContent='Goed bezig — '+s.done+' afgerond!';ss.textContent='Elke dag een beetje is de sleutel';}
  else if(s.done<20){st.textContent=s.done+' onderwerpen klaar!';ss.textContent='Je bouwt momentum op';}
  else{st.textContent=s.done+' van '+s.total+' afgerond!';ss.textContent=s.pct+'% van de weg naar het diploma';}
  renderDashboard();
  VAKKEN.forEach(v=>renderVak(v));
  renderPlanning();
  renderBronnen();
  renderDuo();
}

function renderDashboard(){
  let html='';
  html+='<div class="dashboard-grid">'+VAKKEN.map(v=>{
    const vs=vakStats(v);
    return `<div class="vak-card" onclick="showPane('${v.id}')">
      <div class="vak-card-name"><span class="vak-dot" style="background:${v.dot}"></span>${v.naam}</div>
      <div class="vak-card-count">${vs.done}/${vs.total} afgerond &nbsp; ${vs.pct}%</div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${vs.pct}%;background:${v.dot}"></div></div>
    </div>`;
  }).join('')+'</div>';

  const actief=[];
  VAKKEN.forEach(v=>v.items.forEach((item,i)=>{if(inMonth(item,currentMonth)&&!isChecked(v.id,i))actief.push({v,item,i});}));
  html+=`<div class="section-label">Nu actief — maand ${currentMonth}</div>`;
  if(!actief.length){html+=`<div style="font-size:13px;color:#aaa;padding:16px;text-align:center">Alle onderwerpen van maand ${currentMonth} zijn afgerond!</div>`;}
  else{html+=actief.slice(0,6).map(({v,item,i})=>`<div class="item" onclick="doToggle('${v.id}',${i})">
    <div class="chk"><div class="chk-mark"></div></div>
    <div class="item-body">
      <div class="item-title">${item.t} <span style="font-size:11px;color:${v.dot};font-weight:400">— ${v.naam}</span></div>
      <div class="item-sub">${item.d}</div>
      <div class="tags">${tagEl(item.type)}<span class="tag tag-actief">actief</span></div>
      ${bronLink(item.url,item.bron)}
    </div></div>`).join('');}
  document.getElementById('pane-dashboard').innerHTML=html;
}

function renderVak(v){
  const vs=vakStats(v);
  const secs={};
  v.items.forEach((item,i)=>{if(!secs[item.fase])secs[item.fase]=[];secs[item.fase].push({item,i});});
  let html=`<div class="vak-tip"><strong>Studietip:</strong> ${v.tip}</div>
  <div class="vak-prog">
    <div class="vak-prog-label"><span>${vs.done} van ${vs.total} afgerond</span><span style="font-weight:700;color:${v.kleur}">${vs.pct}%</span></div>
    <div class="vak-prog-bar"><div class="vak-prog-fill" style="width:${vs.pct}%;background:${v.dot}"></div></div>
  </div>`;
  Object.entries(secs).forEach(([fase,entries])=>{
    html+=`<div class="section-label">${fase}</div>`;
    entries.forEach(({item,i})=>{
      const done=isChecked(v.id,i),aktief=inMonth(item,currentMonth);
      html+=`<div class="item${done?' done':''}" onclick="doToggle('${v.id}',${i})">
        <div class="chk${done?' done':''}"><div class="chk-mark"></div></div>
        <div class="item-body">
          <div class="item-title">${item.t}${aktief&&!done?'<span class="actief-label">nu actief</span>':''}</div>
          <div class="item-sub">${item.d}</div>
          <div class="tags">${tagEl(item.type)}</div>
          ${bronLink(item.url,item.bron)}
        </div>
        <div class="week-badge">wk ${item.wv}–${item.wt}</div>
      </div>`;
    });
  });
  document.getElementById('pane-'+v.id).innerHTML=html;
}

function renderPlanning(){
  let html='<div class="section-label">Selecteer maand</div>';
  html+='<div class="maand-row">'+Array.from({length:12},(_,i)=>i+1).map(m=>
    `<span class="maand-pill${m===activePlanMonth?' active':''}${m===currentMonth&&m!==activePlanMonth?' huidige':''}" onclick="setPlanMonth(${m})">Mnd ${m}</span>`
  ).join('')+'</div>';

  const f=(activePlanMonth-1)*4+1,t=activePlanMonth*4;
  html+=`<div class="section-label">Week ${f}–${t} — maand ${activePlanMonth}</div>`;
  let found=false;
  VAKKEN.forEach(v=>{
    const actief=v.items.map((item,i)=>({item,i})).filter(({item})=>inMonth(item,activePlanMonth));
    if(!actief.length)return; found=true;
    html+=`<div style="font-size:12px;font-weight:700;color:${v.kleur};margin:12px 0 4px">${v.naam}</div>`;
    actief.forEach(({item,i})=>{
      const done=isChecked(v.id,i);
      html+=`<div class="item${done?' done':''}" onclick="doToggle('${v.id}',${i})">
        <div class="chk${done?' done':''}"><div class="chk-mark"></div></div>
        <div class="item-body">
          <div class="item-title">${item.t}</div>
          <div class="item-sub">${item.d}</div>
          <div class="tags">${tagEl(item.type)}</div>
          ${bronLink(item.url,item.bron)}
        </div>
        <div class="week-badge">wk ${item.wv}–${item.wt}</div>
      </div>`;
    });
  });
  if(!found)html+=`<div style="font-size:13px;color:#aaa;padding:16px;text-align:center">Geen actieve onderwerpen in maand ${activePlanMonth}.</div>`;

  html+='<div class="section-label" style="margin-top:1.5rem">Studiefases</div>';
  FASES.forEach(fase=>{
    html+=`<div class="fase-card" style="border-left-color:${fase.kleur}">
      <div class="fase-title" style="color:${fase.kleur}">${fase.naam}</div>
      <div class="fase-period">${fase.periode}</div>
      <div style="font-size:12px;color:#555;margin-bottom:8px">${fase.omschrijving}</div>
      ${fase.per_vak.map(pv=>`<div class="fase-vak"><strong>${pv.vak}:</strong> ${pv.items.join(' · ')}</div>`).join('')}
    </div>`;
  });

  html+=`<button class="set-month-btn" onclick="doSetMonth(${activePlanMonth})">Maand ${activePlanMonth} instellen als huidige maand</button>`;
  document.getElementById('pane-planning').innerHTML=html;
}

function renderBronnen(){
  let html='<div class="section-label">Alle studiebronnen</div>';
  const gratis=BRONNEN_OVERZICHT.filter(b=>b.gratis);
  const betaald=BRONNEN_OVERZICHT.filter(b=>!b.gratis);
  html+='<div class="section-label">Gratis</div>';
  gratis.forEach(b=>{
    html+=`<div class="bron-card">
      <div class="bron-card-body">
        <div class="bron-card-name">${b.naam} <span class="gratis-badge">Gratis</span></div>
        <div class="bron-card-gebruik">${b.gebruik}</div>
        <a href="${b.url}" target="_blank" class="bron-link">Naar website &#8599;</a>
      </div>
    </div>`;
  });
  html+='<div class="section-label">Tweedehands boeken (~€10-20)</div>';
  betaald.forEach(b=>{
    html+=`<div class="bron-card">
      <div class="bron-card-body">
        <div class="bron-card-name">${b.naam} <span class="betaald-badge">Betaald</span></div>
        <div class="bron-card-gebruik">${b.gebruik}</div>
        <a href="${b.url}" target="_blank" class="bron-link">Zoek op Marktplaats &#8599;</a>
      </div>
    </div>`;
  });
  document.getElementById('pane-bronnen').innerHTML=html;
}

function renderDuo(){
  let html='';
  html+='<div class="info-card">';
  html+='<div class="info-card-title">DUO — Staatsexamen regelen</div>';
  DUO_INFO.forEach(r=>{
    html+=`<div class="info-row"><div class="info-label">${r.label}</div><div class="info-val">${r.val}</div></div>`;
  });
  html+=`<div style="margin-top:12px"><a href="https://duo.nl/particulier/staatsexamen" target="_blank" class="bron-link">Naar duo.nl &#8599;</a></div>`;
  html+='</div>';

  html+='<div class="info-card">';
  html+='<div class="info-card-title">Dagelijkse studieroutine</div>';
  ROUTINE.forEach(r=>{
    html+=`<div class="routine-day">
      <div class="routine-day-name" style="color:${r.kleur}">${r.dag}</div>
      <div class="routine-detail">${r.items.join('<br>')}</div>
    </div>`;
  });
  html+='</div>';

  html+='<div class="info-card">';
  html+='<div class="info-card-title">Examentips</div>';
  EXAMENTIPS.forEach(t=>{
    html+=`<div class="tip-item"><div class="tip-item-label">${t.label}</div><div class="tip-item-val">${t.val}</div></div>`;
  });
  html+='</div>';

  document.getElementById('pane-duo').innerHTML=html;
}

window.doToggle=toggle;
window.setPlanMonth=(m)=>{activePlanMonth=m;renderPlanning();};
window.doSetMonth=saveMonth;
window.showPane=(id)=>{
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('pane-'+id).classList.add('active');
  const map={dashboard:0,nl:1,en:2,du:3,wi:4,ec:5,planning:6,bronnen:7,duo:8};
  if(map[id]!==undefined)document.getElementById('main-tabs').children[map[id]].classList.add('active');
};
</script>
</body>
</html>
